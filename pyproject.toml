[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris-microbrains"
version = "0.6.8"
description = "Sub-2ms pure-NumPy 4-layer pre-flight safety, full-file AST/strict-allowlist/YAML/JS/secret/shell guard, PreToolUse hook & trace-trainable MCP-Zero router (v0.6.6): 97.4% Recall@4 (<=11.9% CP95 drop bound, 39.6% net tokens saved after retries), 42/42 Mondrian alpha=0.05 calibration (>=25/class, n_cal=120..550)"
readme = "README.md"
authors = [
    { name = "Dmitry Tikov", email = "drtikov@gmail.com" }
]
license = { text = "PolyForm Noncommercial License 1.0.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "ai-agents",
    "micro-transformer",
    "mixture-of-experts",
    "edge-ai",
    "conformal-prediction",
    "vector-symbolic-architecture",
    "opencl",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
]

[project.optional-dependencies]
opencl = [
    "pyopencl>=2022.1",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/drtikov/microbrainsforagents"
Repository = "https://github.com/drtikov/microbrainsforagents.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["aetheris_microbrains*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.npz", "*.md"]
