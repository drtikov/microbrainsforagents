[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris-microbrains"
version = "0.7.6"
description = "Deterministic, sub-2ms pre-flight policy engine and tool router for AI agents (pure NumPy, zero-GPU)."
readme = "README.md"
authors = [
    { name = "Dmitry Tikov", email = "drtikov@gmail.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "ai-agents",
    "mcp",
    "claude-code",
    "llm-security",
    "conformal-prediction",
    "numpy",
    "tool-routing",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
]

[project.optional-dependencies]
opencl = [
    "pyopencl>=2022.1",
]
server = [
    "fastapi>=0.100.0",
    "starlette>=0.40.0",
    "anyio>=4.4.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
]
ast = [
    "tree-sitter>=0.23.0",
    "tree-sitter-bash>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-yaml>=0.6.0",
]
guard-ml = [
    "onnxruntime>=1.16.0",
    "tokenizers>=0.19.0",
]
mcp = [
    "mcp>=1.8.0,<2.0.0",
]
hermes = [
    "PyYAML>=6.0",
]
lab = [
    "numpy>=1.22.0",
]
otel = []

[project.scripts]
aetheris = "aetheris_microbrains.cli:main"
aetheris-hook = "aetheris_microbrains.hook:main"
aetheris-doctor = "aetheris_microbrains.doctor:main"
aetheris-audit = "aetheris_microbrains.audit:main"
aetheris-daemon = "aetheris_microbrains.hook_daemon:main"
aetheris-verify = "aetheris_microbrains.verify:main"
aetheris-mcp = "aetheris_microbrains.mcp_server:main"
aetheris-mcp-proxy = "aetheris_microbrains.mcp_proxy:main"
aetheris-pr-gate = "aetheris_microbrains.pr_gate:main"
aetheris-install-antigravity = "aetheris_microbrains.install_antigravity:main"
aetheris-install-openclaw = "aetheris_microbrains.install_openclaw:main"

[project.urls]
Homepage = "https://github.com/drtikov/microbrainsforagents"
Repository = "https://github.com/drtikov/microbrainsforagents.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["aetheris_microbrains*"]
exclude = ["aetheris_microbrains.tests*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.npz", "*.md", "py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["*decision_journal*.jsonl", "memory/store/neuro_brains/_candidates/*"]
