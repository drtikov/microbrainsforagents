name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Check critical lint rules (syntax & undefined names)
        run: ruff check --select E9,F63,F7,F82 aetheris_microbrains examples

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with server + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,dev]"
      - name: Run full test suite (includes hook integration tests)
        run: python -m pytest aetheris_microbrains/tests/ -q -W "error::DeprecationWarning:aetheris_microbrains.*" -W "error:.*__package__.*:DeprecationWarning"

  test-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal package (no [server])
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run minimal-install test suite
        run: python -m pytest aetheris_microbrains/tests/ -q -W "error::DeprecationWarning:aetheris_microbrains.*" -W "error:.*__package__.*:DeprecationWarning"
      - name: Installed wheel smoke check (outside checkout)
        run: |
          pip wheel --no-deps . -w /tmp/wheelhouse
          python -m venv /tmp/wheel_venv
          /tmp/wheel_venv/bin/pip install /tmp/wheelhouse/*.whl
          (cd /tmp && /tmp/wheel_venv/bin/python -c "import aetheris_microbrains as mb; assert mb.decide({'tool':'read_file','path':'README.md'})['decision'] == 'allow'; assert mb.evaluate_hook_payload({'tool_name':'Bash','tool_input':{'command':'rm -rf /'}})['exit_code'] == 2")

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit full resolved dependency closure
        # Fails CI on any known vulnerability across the full non-editable dependency closure.
        run: |
          pip install -e ".[server,dev]" --quiet
          pip-audit --skip-editable -f json -o /tmp/audit.json
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/audit.json"))
          vulns = []
          for p in data.get("dependencies", []):
              for v in p.get("vulns", []):
                  vulns.append((p["name"], p["version"], v.get("id"), v.get("fix_versions")))
          if vulns:
              for name, ver, vid, fix in vulns:
                  print(f"::error::VULNERABLE {name}=={ver}: {vid} (fix: {fix})")
              sys.exit(1)
          print(f"dependency audit clean ({len(data.get('dependencies', []))} packages)")
          PY
